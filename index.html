<!DOCTYPE html>
<html lang="zh-cn">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奇迹工作室</title>
    <link rel="icon" href="images/miracle-nobg.ico">
    <style>
        @keyframes start {
            0% {
                background-color: #000;
            }

            100% {
                background-color: #f1f3f4;
            }
        }

        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f1f3f4;
        }

        #logo img {
            display: block;
            margin: 10px;
            border-radius: 5vmin;
            transition: all .2s linear;
        }

        #logo img:hover {
            right: 5px;
            bottom: 5px;
            box-shadow: 10px 10px 20px #303030,
                inset 10px 10px 20px #fff;
        }

        #start {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            animation: start 1s linear;
        }

        #start img {
            width: 50vmin;
        }

        .name {
            font-size: 10vmin;
            font-weight: bold;
            transition: all .2s linear;
        }

        .name:hover {
            text-shadow: 0 0 50px #000;
        }

        #menu img {
            width: 10vmin;
        }

        #content {
            width: 100%;
            background-color: #303030;
            border-top: #f1f3f4 solid 1px;
            color: #fffafa;
        }

        nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
        }

        nav a {
            display: inline-block;
            margin: 10px;
            padding: 2em;
            font-weight: bold;
            font-size: 5vw;
            font-family: fangsong;
            color: #fffafa;
            text-decoration: none;
            transition: all .2s linear;
            border-radius: 2em;
        }

        nav a:hover {
            box-shadow: inset 0 0 30px #fffafa;
        }
    </style>
</head>

<body>
    <div id="start">
        <div id="logo">
            <img src="images/miracle.svg" alt="奇迹工作室" />
        </div>
        <div class="name" style="font-family: fangsong;">
            <span>奇</span><span>迹</span><span>工</span><span>作</span><span>室</span>
        </div>
        <div class="name" style="font-family: 'Times New Roman';">
            <span>M</span><span>i</span><span>r</span><span>a</span><span>c</span><span>l</span><span>e</span>&nbsp;<span>s</span><span>t</span><span>u</span><span>d</span><span>i</span><span>o</span>
        </div>
        <div style="margin-top: 10vmin;"><a href="#000"><img src="/images/arrow-down.svg" alt="↓" style="width: 10vmin;" /></a></div>
    </div>
    <div id="content">
        <h1 id="000" style="text-align: center;">Learn more</h1>
        <nav>
                <a href="info">关于</a>
                <a href="members">成员</a>
                <a href="works">作品</a>
                <a href="activities">动态</a>
                <a href="others">其他</a>
        </nav>
    </div>
    <script src="scripts/main.js"></script>
</body>

</html>
